[package]
name = "dlna-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "A DLNA/UPnP-AV media server for the LAN"
repository = "https://github.com/stuartnelson3/dlna-rs"
readme = "README.md"
keywords = ["dlna", "upnp", "media-server", "ssdp"]
categories = ["multimedia", "network-programming"]

[dependencies]
bytes = "1.12.1"
env_logger = "0.11.11"
futures-core = { version = "0.3.34", default-features = false }
http-body-util = "0.1.5"
humantime-serde = "1.1.1"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "http1"] }
if-addrs = "0.15.0"
lexopt = "0.3.2"
lofty = "0.25.1"
log = "0.4.34"
quick-xml = "0.42.0"
redb = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "fs", "time", "signal", "macros", "io-util"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["io"] }
toml = "1.1.5"
uuid = { version = "1.26.1", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
proptest = "1.11.0"
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# NOT "abort": with tokio's task-per-connection model, a panic in one
# request-handling task should fail that task, not the whole process. A
# malformed request from an untrusted LAN client (this is a network-facing
# daemon - see docs/THREAT_MODEL.md) shouldn't be able to take the server
# down just by triggering a reachable panic.
panic = "unwind"

[package]
name = "dlna-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[dependencies]
env_logger = "0.11.11"
humantime-serde = "1.1.1"
lexopt = "0.3.2"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "fs", "time", "signal", "macros"] }
toml = "1.1.5"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# NOT "abort": with tokio's task-per-connection model, a panic in one
# request-handling task should fail that task, not the whole process. A
# malformed request from an untrusted LAN client (this is a network-facing
# daemon - see docs/THREAT_MODEL.md) shouldn't be able to take the server
# down just by triggering a reachable panic.
panic = "unwind"

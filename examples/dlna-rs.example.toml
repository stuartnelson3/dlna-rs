[server]
friendly_name = "example-music"
port = 8200
interface = "eth0"
uuid = "auto"

[media]
directories = [
    { path = "/srv/media/music", kind = "audio" },
]
follow_symlinks = false
exclude_patterns = ["*.tmp", ".*"]

[ssdp]
notify_interval = "15m"

[library]
views = ["folders", "albums", "artists", "recently_added_songs", "recently_added_albums"]

[library.recently_added]
songs_count = 50
albums_count = 20
max_age_days = 90

[rescan]
interval = "4h"
on_startup = true

[logging]
level = "debug"

# Off by default. Speeds up repeated rescans of a large library by
# caching tag reads to disk, keyed by each file's path, size, and
# modification time. Needs a real writable path - see
# systemd/dlna-rs.service's StateDirectory= comment if running under
# that unit.
#[tag_cache]
#enabled = true
#path = "/var/lib/dlna-rs/tags.redb"

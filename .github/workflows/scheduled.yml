name: Scheduled checks

# Independent of code changes: catches newly disclosed RUSTSEC advisories
# against pinned dependency versions even when nothing was pushed.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # See ci.yml's own audit job for why this is needed: the action
    # posts its result as a check run, which needs checks: write.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz-long:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ssdp_parse, soap_parse, range_parse, path_resolve]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=1800
